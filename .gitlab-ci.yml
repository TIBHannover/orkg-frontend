stages:
  - test
  - build
  - package-build
  - package-test
  - publish
  - release
  - pages

include:
  # Docker build / scan / publish: https://to-be-continuous.gitlab.io/doc/ref/docker/
  - component: $CI_SERVER_FQDN/to-be-continuous/docker/gitlab-ci-docker@8.5.1
    inputs:
      build-tool: buildah # daemonless: no privileged dind runner needed
      prod-publish-strategy: auto
      healthcheck-disabled: true # the Dockerfile has no HEALTHCHECK
      trivy-image: ghcr.io/aquasecurity/trivy:latest # avoid Docker Hub rate limits
  - component: $CI_SERVER_FQDN/components/dependency-scanning/main@2.0.0
    inputs:
      stage: test
      job_name: dependency_scanning
      disabled_resolution_jobs: maven,gradle,python
  - component: $CI_SERVER_FQDN/TIBHannover/gitlab-ci-components/pipeline-trigger-orkg@0.0.9
    inputs:
      component_name: orkg-frontend
      needs:
        - job: docker-publish
          optional: true

variables:
  # forks only test and lint
  CANONICAL_PROJECT_PATH: TIBHannover/orkg/orkg-frontend
  # We run branch pipelines only, so TBC's adaptive rules would keep hadolint/trivy
  # manual until the next push after an MR opens; run them on every push instead
  ADAPTIVE_PIPELINE_DISABLED: 'true'

# Branch pipelines only (no duplicate MR pipelines), and per-ref extra tags:
# master -> :master + :latest, version tags -> :<tag> + :release (used by the deployment)
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    # Forks can't push to any registry: skip every job that touches one
    - if: '$CI_PROJECT_PATH != $CANONICAL_PROJECT_PATH'
      variables:
        DOCKER_BUILD_TOOL: none # matches no build job -> no image build/push
        DOCKER_TRIVY_DISABLED: 'true'
        DOCKER_SBOM_DISABLED: 'true'
        PUBLISH_ON_PROD: 'false'
    - if: $CI_COMMIT_TAG
      variables:
        DOCKER_RELEASE_EXTRA_TAGS: release
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        DOCKER_RELEASE_EXTRA_TAGS_PATTERN: '^master$'
        DOCKER_RELEASE_EXTRA_TAGS: latest
    - when: always

# Shared Node setup: cache npm's download cache (not node_modules — `npm ci` wipes it)
.node:
  image: node:24-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

vitest:
  extends: .node
  stage: test
  script:
    - cp default.env .env
    - npm run test:ci
  artifacts:
    when: always
    reports:
      junit:
        - junit.xml

widget:
  image: node:24-bookworm
  stage: test
  script:
    - npm run widget:build
    - npm run test:widget

dependency_scanning:
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# Keep the image scan informational (like the container-scanning component it replaces)
docker-trivy:
  allow_failure: true

# deploy storybook to Gitlab pages
pages:
  extends: .node
  stage: pages
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull # populated by vitest in an earlier stage
  script:
    - rm -rf public # drop the app's static files; only the storybook build is deployed
    - mkdir -p public/storybook
    - npm run build-storybook
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
